name: Build and publish wheels

on:
  release:
    types:
      - published
  workflow_dispatch:

# CPU wheels only. CUDA stays FLOWEDGE_BACKEND=cuda from source, including
# after a future PyPI upload. Do not add a CUDA extra this workflow cannot ship.
jobs:
  check-version:
    name: Tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare v-tag to pyproject.toml
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)
          echo "pyproject version=$ver"
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "workflow_dispatch: skip tag match (v0.1.1 shipped 0.1.0 wheel names; v0.1.2 matches pyproject)"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::release tag v$tag does not match pyproject version $ver"
            exit 1
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp* *-musllinux_* *-win32 *-manylinux_i686"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_lerobot_plugin:
    name: Build LeRobot plugin wheel
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pure Python plugin wheel
        run: pipx run build --wheel integrations/lerobot --outdir plugin-dist
      - uses: actions/upload-artifact@v4
        with:
          name: lerobot-plugin-wheel
          path: plugin-dist/*.whl

  attach-to-release:
    name: Attach CPU and LeRobot wheels to the GitHub Release
    if: github.event_name == 'release'
    needs: [build_wheels, build_sdist, build_lerobot_plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: lerobot-plugin-wheel
          path: dist

      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber

  publish-to-pypi:
    if: vars.FLOWEDGE_PUBLISH_PYPI == 'true'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Required for Trusted Publishing. Off until FLOWEDGE_PUBLISH_PYPI is true.
    # Wheels are CPU-only (cibuildwheel). CUDA stays FLOWEDGE_BACKEND=cuda from source.
    # Confirm https://pypi.org/project/flowedge/ is still free before the first upload.
    environment:
      name: pypi
      url: https://pypi.org/p/flowedge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
