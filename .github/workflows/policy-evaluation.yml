name: Pinned visual policy evaluation
on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner label (use self-hosted for accelerator hosts)
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
      model_id:
        description: Hugging Face policy repository
        type: string
        default: lerobot/diffusion_pusht
      revision:
        description: Immutable Hugging Face revision
        type: string
        default: 84a7c23178445c6bbf7e1a884ff497017910f653
      iterations:
        description: Matched replay samples (small runs do not establish p99)
        type: number
        default: 20
      warmup:
        description: Warmup samples excluded from reported quantiles
        type: number
        default: 2
      steps:
        description: DDIM inference steps
        type: number
        default: 10
      threads:
        description: PyTorch and FlowEdge CPU thread count
        type: number
        default: 1
      max_steps:
        description: Steps per bounded PushT episode
        type: number
        default: 100

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      ITERATIONS: ${{ inputs.iterations }}
      WARMUP: ${{ inputs.warmup }}
      INFERENCE_STEPS: ${{ inputs.steps }}
      THREADS: ${{ inputs.threads }}
      MAX_STEPS: ${{ inputs.max_steps }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned policy runtime
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'lerobot[diffusion]==0.6.1'
          python -m pip install . -e 'integrations/lerobot[evaluation]'
          python -m unittest discover -s integrations/lerobot/tests -v
      - name: Fetch and convert the trained checkpoint
        run: |
          hf download "$MODEL_ID" --revision "$REVISION" \
            --include config.json model.safetensors --local-dir models/diffusion_pusht
          python -m flowedge_dev pipeline convert models/diffusion_pusht models/policy.safetensors --arch diffusion --dtype f32
      - name: Verify complete policy replay and capture measurements
        run: |
          python -m flowedge_dev bench policy models/policy.safetensors \
            --source models/diffusion_pusht --revision "$REVISION" --model-id "$MODEL_ID" \
            --threads "$THREADS" --iterations "$ITERATIONS" --warmup "$WARMUP" \
            --steps "$INFERENCE_STEPS" --output bench-results/replay.json
      - name: Run matched bounded PushT episodes
        run: |
          for backend in flowedge lerobot; do
            python -m flowedge_lerobot.evaluate models/policy.safetensors \
              --source models/diffusion_pusht --backend "$backend" --episodes 1 \
              --max-steps "$MAX_STEPS" --steps 10 --threads 1 --output "bench-results/pusht-$backend.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-policy-evaluation
          path: bench-results/
          if-no-files-found: warn
