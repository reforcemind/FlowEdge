name: CI
# Compile, lint, ctest. ULP/tools/conversion/diffusion parity is local (Grok Bot).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    name: Clang Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: cmake -B build -S . -DFLOWEDGE_RELAY=ON -DFLOWEDGE_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: bash ./tools/scripts/lint.sh

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [cpu]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-llvm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure CMake
        run: cmake -B build -S . -DFLOWEDGE_RELAY=ON -DFLOWEDGE_TESTS=ON -DFLOWEDGE_PYTHON=ON -DFLOWEDGE_BACKEND=${{ matrix.backend }}

      - name: Build
        if: matrix.backend == 'cpu'
        run: cmake --build build --config Release -j 4

      - name: CTest Suite
        if: matrix.backend == 'cpu'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify pip install ships an importable module
        if: matrix.backend == 'cpu'
        shell: bash
        run: |
          pip install . huggingface_hub
          python -c "import flowedge; print('import OK:', flowedge.Engine)"

      - name: Verify LeRobot adapter contract
        if: matrix.backend == 'cpu'
        shell: bash
        run: PYTHONPATH=integrations/lerobot/src python -m unittest discover -s integrations/lerobot/tests -v

      - name: Verify LeRobot rollout command
        if: matrix.backend == 'cpu'
        shell: bash
        run: |
          pip install --no-deps -e integrations/lerobot
          flowedge-lerobot-rollout --help
          flowedge-lerobot-preflight --help

  arm64-neon:
    name: ARM64/NEON validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record runner
        run: uname -a && lscpu && free -h
      - name: Configure
        run: >-
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFLOWEDGE_RELAY=ON -DFLOWEDGE_TESTS=ON -DFLOWEDGE_BENCH=ON
          -DFLOWEDGE_BACKEND=cpu
      - name: Build
        run: cmake --build build-arm64 -j 2
      - name: CTest
        run: ctest --test-dir build-arm64 --output-on-failure
      - name: LeRobot adapter contract
        run: |
          python -m pip install --disable-pip-version-check numpy huggingface_hub
          PYTHONPATH=integrations/lerobot/src python -m unittest discover -s integrations/lerobot/tests -v
      - name: Profile native policy
        run: |
          mkdir -p models
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL \
            "https://huggingface.co/ReForceMind/mamba_flow/resolve/main/mamba_flow.safetensors" \
            -o models/mamba_flow.safetensors
          ./build-arm64/flowedge-profile models/mamba_flow.safetensors \
            --solver euler --steps 10 --period-us 100000 --iterations 50 --warmup 5 \
            --json arm64-profile.json
      - name: Upload ARM64 profile
        uses: actions/upload-artifact@v4
        with:
          name: flowedge-arm64-profile
          path: arm64-profile.json

  sanitizers:
    name: ASan/UBSan (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-llvm
      - name: Run bounded sanitizer verification
        run: bash ./tools/scripts/sanitize.sh
      - name: Upload sanitizer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flowedge-sanitizer-logs
          path: build-sanitizers/Testing/Temporary/*.log
          if-no-files-found: ignore

  onnx-parity:
    name: ONNX adapter parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export a fixed-shape policy and compare ONNX Runtime
        run: |
          python -m pip install --disable-pip-version-check numpy onnx onnxruntime onnxscript \
            --extra-index-url https://download.pytorch.org/whl/cpu torch
          PYTHONPATH=integrations/onnx/src python -m unittest discover -s integrations/onnx/tests -v

  lerobot-plugin:
    name: LeRobot plugin behavior and evaluation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the supported LeRobot runtime and plugin
        run: |
          python -m pip install --disable-pip-version-check \
            --extra-index-url https://download.pytorch.org/whl/cpu 'lerobot[dataset,diffusion]==0.6.1'
          python -m pip install --no-deps -e . -e integrations/lerobot
      - name: Verify installed plugin behavior and evaluation contracts
        run: |
          python -m unittest discover -s integrations/lerobot/tests -v
          flowedge-lerobot-benchmark --help
          flowedge-lerobot-evaluate --help
          flowedge-lerobot-package --help
          flowedge-lerobot-preflight --help
          lerobot-rollout --help

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Image
        run: docker build -t flowedge:latest .
