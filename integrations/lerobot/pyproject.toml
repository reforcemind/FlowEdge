[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_flowedge"
version = "0.2.0"
description = "LeRobot out-of-tree deployment plugin for FlowEdge Diffusion Policy and SmolVLA"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "flowedge>=0.1.0",
  "lerobot>=0.6.1,<0.7",
  "numpy>=1.20",
]

[project.scripts]
flowedge-lerobot-rollout = "flowedge_lerobot.cli:main"
flowedge-lerobot-benchmark = "flowedge_lerobot.benchmark:main"
flowedge-lerobot-evaluate = "flowedge_lerobot.evaluate:main"
flowedge-lerobot-package = "flowedge_lerobot.deployment:main"
flowedge-lerobot-preflight = "flowedge_lerobot.preflight:main"

[project.optional-dependencies]
evaluation = ["gym-pusht==0.1.5", "pymunk>=6.6,<7"]
dp = ["lerobot[diffusion]>=0.6.1,<0.7"]
rollout = ["lerobot[dataset,diffusion]>=0.6.1,<0.7"]
so101 = ["lerobot[dataset,diffusion,feetech]>=0.6.1,<0.7"]
smolvla = ["lerobot[smolvla]>=0.6.1,<0.7"]

[tool.setuptools.packages.find]
where = ["src"]
